<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Speed Quiz</title>
    <style>
        /* FIX 1: This stops inputs from overflowing outside their containers */
        * { box-sizing: border-box; }

        /* Global Styles */
        body { 
            font-family: 'Khmer OS Battambang', 'Suwannaphum', 'Segoe UI', sans-serif; 
            background-color: #060737; /* Deep Navy Blue */
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Header Section matching the reference */
        .top-header {
            max-width: 800px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #d4af37; /* Gold text */
            font-weight: bold;
            font-size: 14px;
        }
        
        .left-logo {
            text-align: center;
        }
        
        .left-logo img {
            width: 70px;
            margin-bottom: 10px;
        }
        
        .right-text {
            text-align: center;
        }

        /* Main White Container */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.3); 
            width: 100%;
        }

        .hidden { display: none; }
        
        h2.title {
            text-align: center;
            font-size: 20px;
            color: #060737;
            margin-top: 0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Form Controls */
        .input-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        input[type="text"] {
            flex-grow: 1;
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #777;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }

        button { 
            background: #09316b; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 6px; 
            font-size: 16px;
            font-family: inherit;
            cursor: pointer; 
            transition: background 0.3s;
            white-space: nowrap; /* Prevents text from breaking into two lines */
        }

        button:hover { background: #0c4394; }

        /* Quiz Screen Styles */
        .timer-text {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #060737;
            margin-bottom: 30px;
        }

        .question { 
            margin-bottom: 25px; 
        }
        
        .question h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #000;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Leaderboard Table Styles */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        
        th, td { 
            padding: 12px; 
            text-align: center; 
            border: 1px solid #ddd; 
        }
        
        th { 
            background: #09316b; 
            color: white; 
            font-weight: normal;
        }
        
        .error { color: red; font-weight: bold; text-align: center; }

        /* FIX 2: MOBILE RESPONSIVENESS */
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column; /* Stacks the text box and button on phones */
                gap: 10px;
            }
            button {
                width: 100%; /* Makes the button take up the full width */
            }
            .container {
                padding: 30px 20px; /* Reduces the thick white padding on small screens */
            }
            .top-header {
                font-size: 12px; /* Scales down header text so it doesn't bunch up */
            }
            .left-logo img {
                width: 55px; /* Scales down logo */
            }
        }
    </style>
</head>
<body>

<!-- Header Section with Logos -->
<div class="top-header">
    <div class="left-logo">
    <img src="logo.png" alt="Logo">
    <div>ក្រសួងមុខងារសាធារណៈ<br>អគ្គលេខាធិការដ្ឋាន<br>នាយកដ្ឋានធនធានមនុស្ស</div>
</div>
<div class="right-text">
        <div>ព្រះរាជាណាចក្រកម្ពុជា<br>ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
</div>
</div>

<div class="container">
    <!-- Registration Screen -->
    <div id="start-screen">
        <h2 class="title">សូមស្វាគមន៍សម្រាប់ការចូលរួមឆ្លើយសំណួរ!</h2>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="សូមបំពេញឈ្មោះរបស់លោក លោកស្រី" required>
            <button onclick="startQuiz()">ចាប់ផ្ដើម!</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="timer-text">រយៈពេល: <span id="timer">0.0</span>s</div>
        <div id="questions-container">កំពុងទាញយកសំណួរ...</div>
        <br>
        <button onclick="submitQuiz()" id="submit-btn" class="hidden" style="width:100%;">បញ្ជូនចម្លើយ</button>
    </div>

    <!-- Leaderboard Screen -->
    <div id="leaderboard-screen" class="hidden">
        <h2 class="title">តារាងពិន្ទុ</h2>
        <div style="overflow-x: auto;"> <!-- Allows table to scroll left/right on tiny phones -->
            <table>
                <thead>
                    <tr>
                        <th>ល.រ</th>
                        <th>ឈ្មោះ</th>
                        <th>ពិន្ទុ</th>
                        <th>រយៈពេល</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Data gets injected here -->
                </tbody>
            </table>
        </div>
        <button onclick="location.reload()" style="width:100%;">សាកល្បងម្ដងទៀត!</button>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzZ8my2PjCDeVmzKfPwLD0d7EtL_yrrqfUG1_JOa4IpQEwuAxsDWr1ONlBFrKBj5Twvgg/exec';
    let startTime;
    let timerInterval;
    let userAnswers = {};

    async function startQuiz() {
        const name = document.getElementById('playerName').value;
        if (!name) return alert('សូមបំពេញឈ្មោះរបស់អ្នក (Please enter a name)');

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        try {
            const response = await fetch(`${API_URL}?action=getQuestions`);
            const textResponse = await response.text();
            
            if (textResponse.startsWith('<')) {
                throw new Error("Google Apps Script is blocked. Did you deploy with Access set to 'Anyone'?");
            }

            const questions = JSON.parse(textResponse);
            renderQuestions(questions);
            
            startTime = Date.now();
            timerInterval = setInterval(() => {
                document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(1);
            }, 100);

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('questions-container').innerHTML = `<p class="error">Error loading questions: ${error.message}</p>`;
        }
    }

    function renderQuestions(questions) {
        const container = document.getElementById('questions-container');
        container.innerHTML = ''; 
        
        questions.forEach((q, index) => {
            let html = `<div class="question">
                <h3>${index + 1}. ${q.question}</h3>`;
            
            q.options.forEach(opt => {
                html += `<label>
                    <input type="radio" name="q_${q.id}" value="${String(opt).replace(/"/g, '&quot;')}" onchange="saveAnswer('${q.id}', this.value)"> ${opt}
                </label>`;
            });
            html += `</div>`;
            container.innerHTML += html;
        });
        document.getElementById('submit-btn').classList.remove('hidden');
    }

    function saveAnswer(qId, answer) {
        userAnswers[qId] = answer;
    }

    async function submitQuiz() {
        clearInterval(timerInterval);
        const timeTaken = Date.now() - startTime;
        const name = document.getElementById('playerName').value;

        const quizContainer = document.getElementById('quiz-screen');
        const oldHTML = quizContainer.innerHTML;
        quizContainer.innerHTML = '<h2 class="title" style="margin-top:20px;">កំពុងបញ្ជូនចម្លើយ...</h2>';

        try {
            await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify({
                    name: name,
                    answers: userAnswers,
                    timeTaken: timeTaken
                })
            });

            loadLeaderboard();
        } catch (error) {
            console.error("Submission Error:", error);
            alert("Failed to submit. Check console for details.");
            quizContainer.innerHTML = oldHTML; 
        }
    }

    async function loadLeaderboard() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.remove('hidden');

        try {
            const response = await fetch(`${API_URL}?action=getLeaderboard`);
            const leaderboard = await response.json();

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            leaderboard.forEach((player, index) => {
                let totalSeconds = player.time / 1000;
                let minutes = Math.floor(totalSeconds / 60);
                let seconds = (totalSeconds % 60).toFixed(2);
                let displayTime = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;

                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${player.name}</td>
                        <td>${player.score}</td>
                        <td>${displayTime}</td>
                    </tr>
                `;
            });
        } catch (error) {
            document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" class="error">Failed to load leaderboard.</td></tr>`;
        }
    }
</script>

</body>
</html>
